---
title: Blog
---
<h1>Blog</h1>

{% if site.posts.size == 0 %}
<p>No posts yet.</p>
{% else %}
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="post-date">{{ post.date | date: '%b %-d, %Y' }}</span>
    {% if post.description %}<p>{{ post.description }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
{% endif %}
